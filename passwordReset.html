<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/passwordReset.css">
    <title>Password Reset</title>
</head>
<body>
   <header>
        <nav class="navlinks">
            <h1 class="logo">NIIT</h1>
            <p><a href="./landingPage.html">&larr;Back To Home</a></p>
        </nav>
    </header>

     <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Reset Your Password</h1>
                <p class="login-subtitle">Input your Student / Lecturer ID and Email Address </p>
            </div>

            <form class="login-form" method="POST">
                    <div class="form-group">
                        <label for="studentId">Matriculation / Student ID</label>
                        <input type="text" id="studentId" placeholder="e.g. 230591..." required/>
                    </div>
                    
                    <div class="form-group">
                        <label for="studentId">Email</label>
                        <input type="email" id="email" placeholder="johndoe66@gmail.com" required/>
                        <div class="hide"></div>
                    </div>

                    <div class="form-group" id="otp-group" style="display: none;">
                        <label for="otp">OTP Verification Code</label>
                        <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
                    </div>

                    <div class="form-group" id="password-group" style="display: none;">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password">
                    </div>

                    <button type="submit" class="login-btn" id="reset-btn">Reset Password</button>
            </form>
        </div>
  </main>
  <script src="js/passwordReset.js"></script>
</body>
</html>
