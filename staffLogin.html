<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | NIIT Smart Attendance</title>

    <link rel="stylesheet" href="css/staffLogin.css">
</head>
<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand-section">
                <div class="brand-icon">N</div>

                <h1>NIIT</h1>
                <p>SMART ATTENDANCE</p>
            </div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Sign in to access your administrator dashboard.</p>
            </div>

            <form id="staffLoginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    Sign In
                </button>

            </form>

            <p id="message" class="message"></p>

            <div class="login-footer">
                <p>Authorized Staff Access Only</p>
                <small>NIIT Smart Attendance &copy; 2026</small>
            </div>

        </section>

    </main>

    <script src="js/staffLogin.js"></script>

</body>
</html>
