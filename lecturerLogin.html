<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Lecturer Portal Login</title>
</head>
<body>
    <header>
        <nav class="navlinks">
            <h1 class="logo">NIIT</h1>
            <p><a href="./landingPage.html">&larr;Back To Home</a></p>
        </nav>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Lecturer Portal Login</h1>
                <p class="login-subtitle">Enter your lecturer ID and password to access the lecturer dashboard.</p>
            </div>

            <form class="login-form" method="POST">
                <div class="form-group">
                    <label for="lecturerId">Lecturer ID</label>
                    <input type="text" id="lecturerId" placeholder="230590..." required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Create a password" required/>

                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fa-regular fa-eye" style="color: rgb(190, 192, 195);"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="./passwordReset.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <div class="register-redirect">
                    <p>Don't have a lecturer account yet? <a href="./lecturerRegister.html" class="forgot-link">Register here</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="js/lecturerLogin.js"></script>
</body>
</html>
