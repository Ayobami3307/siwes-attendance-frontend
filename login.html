<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>NIIT Student Portal - Login</title>
</head>
<body>
    <header>
        <nav class="navlinks">
            <h1 class="logo">NIIT</h1>
            <p><a href="./landingPage.html">&larr;Back To Home</a></p>
        </nav>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Student Portal Login</h1>
                <p class="login-subtitle">Enter your student ID and password to access the QR scanner dashboard.</p>
            </div>

            <form class="login-form">
                    <div class="form-group">
                        <label for="studentId">Matriculation / Student ID</label>
                        <input type="text" id="studentId" placeholder="230591..." required/>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Input Your Password"/>
                            <button type="button" class="password-toggle" id="passwordToggle">
                                <i class="fa-regular fa-eye" style="color: rgb(190, 192, 195);"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember" id="remember-me"/> Remember me
                        </label>
                        <a href="./passwordReset.html" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>

                    <div class="register-redirect">
                    <p>Don't have an account yet? <a href="./register.html" class="forgot-link">Register here</a></p>
                </div>
            </form>
        </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
